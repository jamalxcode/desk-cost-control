# Middle East Grok Bot Watch Desk - Spend Caps Configuration (Example / Placeholder)
# NOTE: Placeholders only. No live secrets or API keys are stored in this repository.

# Cost Mode Switch:
# - 'optimized': Enforces deduplication, triage routing, delta digests, and batching.
# - 'legacy': Rollback mode running unthrottled prompts and legacy polling.
cost_mode: "optimized"

# Spend Thresholds & Budget Limits:
thresholds:
  # Daily Grok Bot token spend as a percentage of weekly allocated budget
  # Soft breach (70%): Log warning alert to Accounts channel, restrict non-priority queries
  daily_grok_weekly_pct_soft: 70
  # Hard breach (90%): Pause non-alert routines, throttle background polling
  daily_grok_weekly_pct_hard: 90

  # Daily direct X API spend cap in USD
  # Soft breach ($15.00): Restrict to primary news handles, disable exploratory wide searches
  daily_x_usd_soft: 15.00
  # Hard breach ($25.00): Hard stop on non-ALERT X API calls
  daily_x_usd_hard: 25.00

  # Enforcement Policy:
  # When hard cap is breached, automatically pause all non-ALERT desk runs and routine packs.
  # ALERT bypasses remain active to ensure critical early warning is never suppressed.
  pause_non_alert_on_hard: true

# Token Budget Limits per LLM Invocation:
token_budgets:
  max_output_items: 5
  max_chars_per_headline: 140
  max_chars_per_fact: 280
  max_input_delta_tokens: 1200

